<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1411" />
    <!-- Served for /museum* and /m/* (see vercel.json) so gift links preview as an
         invitation, not as the screenshot tool. Never put personal data here. -->
    <title>Museum of You</title>
    <meta name="description" content="Someone built a museum about you. Tap to enter." />

    <meta property="og:title" content="You're invited to a private exhibition" />
    <meta property="og:description" content="Someone built a museum about you. Tap to enter." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://shotpolish.org/museum-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A gold museum ticket: you're invited to a private exhibition" />
    <meta property="og:site_name" content="Museum of You" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="You're invited to a private exhibition" />
    <meta name="twitter:description" content="Someone built a museum about you. Tap to enter." />
    <meta name="twitter:image" content="https://shotpolish.org/museum-og.png" />

    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="museum-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" />

    <!-- Plausible Analytics -->
    <script async src="https://plausible.io/js/pa-81dySPQEF3nl2cWYeWU0_.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
    <style>html,body{background:#0a1411}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
